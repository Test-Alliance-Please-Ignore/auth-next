name: Branches

# Runs on the pull_request event (not push). Listening to both meant every branch
# push triggered two identical "Check" runs — one for the push and one for the
# PR's synchronize event. The pull_request event is the better signal anyway: it
# tests the simulated merge into main, not the raw tip.
on:
  pull_request:
    branches: ['main']
  # Required for the merge queue: without this trigger, "Check" is never reported
  # for a queued commit and the queue times out waiting for it.
  merge_group:

# Cancel superseded PR runs, but NEVER cancel a merge_group run: the queue reads
# a cancelled check as a failure and ejects the PR. Merge group refs are unique
# per queue entry, so there is nothing to supersede there anyway.
concurrency:
  group: branches-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  # Docs-only PRs used to be skipped with a workflow-level `paths-ignore`. That is
  # incompatible with required status checks: a workflow skipped by path filtering
  # never reports its check at all, so "Check" sits Pending forever and the PR can
  # never be merged or queued. A job skipped by an `if:` condition instead reports
  # Success, which is what lets a docs-only PR through. So the path decision has to
  # be made here, in a job, rather than in the `on:` block.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Check for non-doc changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Empty on merge_group; the script then fails safe to running everything.
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/ci/detect-code-changes.mjs

  check:
    name: Check
    needs: changes
    # Fail safe: only an explicit 'false' skips. If the changes job errored, its
    # output is empty and the checks run rather than silently reporting Success.
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: timerboard_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d timerboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prod=false --child-concurrency=10
      - name: Validate Discord Client ID Wiring
        run: node scripts/ci/validate-discord-client-id-wiring.mjs
      - name: Export UI Discord Client ID
        run: echo "VITE_DISCORD_CLIENT_ID=$(node scripts/ci/get-ui-discord-client-id.mjs)" >> "$GITHUB_ENV"
      - name: Validate UI Build Env Injection
        run: |
          pnpm -F ui build
          node scripts/ci/validate-ui-build-env-injection.mjs
      - name: Check & Test
        run: bun runx ci check
      - name: Focused Tests
        run: bun runx ci test
      - name: Migrate Core Integration Database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/timerboard_test
        run: |
          set -euo pipefail
          for migration in apps/core/.migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Core PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/timerboard_test
        run: pnpm -F core test:integration
