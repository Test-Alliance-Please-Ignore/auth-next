name: Release

on:
  push:
    branches: ['main']

env:
  FORCE_COLOR: 1

jobs:
  # Skip the check/test/deploy pipeline when a push only touched docs or config.
  # Shares scripts/ci/detect-code-changes.mjs with branches.yml so the ignore
  # list is defined in exactly one place.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Check for non-doc changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: node scripts/ci/detect-code-changes.mjs

  test-and-deploy:
    name: Test and Deploy
    needs: changes
    # Fail safe: only an explicit 'false' skips. An empty output (changes job
    # errored) still deploys rather than silently skipping a real code change.
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: ${{ github.workflow }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: timerboard_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d timerboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prod=false --child-concurrency=10
      - name: Validate Discord Client ID Wiring
        run: node scripts/ci/validate-discord-client-id-wiring.mjs
      - name: Export UI Discord Client ID
        run: echo "VITE_DISCORD_CLIENT_ID=$(node scripts/ci/get-ui-discord-client-id.mjs)" >> "$GITHUB_ENV"
      - name: Validate UI Build Env Injection
        run: |
          pnpm -F ui build
          node scripts/ci/validate-ui-build-env-injection.mjs
      - name: Check & Test
        run: bun turbo check:ci
      - name: Focused Tests
        run: bun runx ci test
      - name: Migrate Core Integration Database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/timerboard_test
        run: |
          set -euo pipefail
          for migration in apps/core/.migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Core PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/timerboard_test
        run: pnpm -F core test:integration
      - name: Migrate Core Database
        run: pnpm -F core db:migrate
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.CORE_DATABASE_URL_MIGRATIONS }}
      - name: Seed Timerboard Permissions
        run: pnpm -F groups db:seed-timerboard-permissions
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.GROUPS_DATABASE_URL_MIGRATIONS }}
      - name: Deploy
        run: bun turbo deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  notify-discord:
    # Post a deploy status card to Discord whether the deploy passed or failed.
    # `if: always()` is required — without it this job is skipped when
    # test-and-deploy fails, which is exactly when we most want the alert.
    name: Notify Discord
    needs: test-and-deploy
    # Fire on success and failure, but stay silent when the deploy was skipped
    # (docs-only push) — there's nothing to announce.
    if: always() && needs.test-and-deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send deploy status to Discord
        env:
          # Discord channel webhook URL (Server Settings → Integrations → Webhooks).
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.test-and-deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Skip silently on forks / when the webhook isn't configured, rather
          # than failing the run with a curl error.
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo 'DISCORD_DEPLOY_WEBHOOK_URL is not set — skipping notification.'
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = 'success' ]; then
            title='✅ Deploy succeeded'
            color=3066993   # green
          else
            title="❌ Deploy ${DEPLOY_RESULT}"   # failure / cancelled
            color=15158332  # red
          fi

          # First line of the commit message, trimmed for the embed.
          summary="$(printf '%s' "$COMMIT_MSG" | head -n1)"

          # Build the payload with jq so message text is safely JSON-escaped.
          payload="$(jq -n \
            --arg title "$title" \
            --arg url "$RUN_URL" \
            --argjson color "$color" \
            --arg summary "$summary" \
            --arg actor "$ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "${SHA:0:7}" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Commit", value: "[\($sha)](\($commit_url)) \($summary)" },
                  { name: "Triggered by", value: $actor, inline: true }
                ]
              }]
            }')"

          curl -sf -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"

  create-release-pr:
    # For Workers, we always deploy on commits to main.
    # Release PRs are for adding changelogs only (for convenience)
    name: Create Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: ${{ github.workflow }}-create-release-pr
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prod=false --child-concurrency=10
      - name: Create Release PR
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
