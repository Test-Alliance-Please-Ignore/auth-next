name: Release

on:
  push:
    branches: ['main']

env:
  FORCE_COLOR: 1

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: ${{ github.workflow }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=10
      - name: Validate Discord Client ID Wiring
        run: |
          node <<'EOF'
          const fs = require('node:fs')

          const discordConfig = fs.readFileSync('apps/discord/wrangler.jsonc', 'utf8')
          const uiConfig = fs.readFileSync('apps/ui/wrangler.jsonc', 'utf8')

          const discordMatch = discordConfig.match(/"DISCORD_CLIENT_ID"\s*:\s*"([^"]+)"/)
          const uiMatch = uiConfig.match(/"VITE_DISCORD_CLIENT_ID"\s*:\s*"([^"]+)"/)

          if (!discordMatch) {
            console.error('Missing DISCORD_CLIENT_ID in apps/discord/wrangler.jsonc')
            process.exit(1)
          }

          if (!uiMatch) {
            console.error('Missing VITE_DISCORD_CLIENT_ID in apps/ui/wrangler.jsonc')
            process.exit(1)
          }

          if (discordMatch[1] !== uiMatch[1]) {
            console.error(
              `Discord client ID mismatch: discord=${discordMatch[1]} ui=${uiMatch[1]}`
            )
            process.exit(1)
          }
          EOF
      - name: Check & Test
        run: bun turbo check:ci
      - name: Sync Discord Secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "${DISCORD_CLIENT_SECRET:-}" ]; then
            echo "::error::Missing GitHub secret DISCORD_CLIENT_SECRET"
            exit 1
          fi
          if [ -z "${DISCORD_BOT_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret DISCORD_BOT_TOKEN"
            exit 1
          fi

          printf '%s' "$DISCORD_CLIENT_SECRET" | pnpm -F discord exec wrangler secret put DISCORD_CLIENT_SECRET --config wrangler.jsonc
          printf '%s' "$DISCORD_BOT_TOKEN" | pnpm -F discord exec wrangler secret put DISCORD_BOT_TOKEN --config wrangler.jsonc
      - name: Deploy
        run: bun turbo deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  create-release-pr:
    # For Workers, we always deploy on commits to main.
    # Release PRs are for adding changelogs only (for convenience)
    name: Create Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: ${{ github.workflow }}-create-release-pr
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=10
      - name: Create Release PR
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
