name: Release

on:
  push:
    branches: ['main']

env:
  FORCE_COLOR: 1

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: ${{ github.workflow }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prod=false --child-concurrency=10
      - name: Validate Discord Client ID Wiring
        run: node scripts/ci/validate-discord-client-id-wiring.mjs
      - name: Export UI Discord Client ID
        run: echo "VITE_DISCORD_CLIENT_ID=$(node scripts/ci/get-ui-discord-client-id.mjs)" >> "$GITHUB_ENV"
      - name: Validate UI Build Env Injection
        run: |
          pnpm -F ui build
          node scripts/ci/validate-ui-build-env-injection.mjs
      - name: Check & Test
        run: bun turbo check:ci
      - name: Focused Tests
        run: bun runx ci test
      - name: Deploy
        run: bun turbo deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  notify-discord:
    # Post a deploy status card to Discord whether the deploy passed or failed.
    # `if: always()` is required — without it this job is skipped when
    # test-and-deploy fails, which is exactly when we most want the alert.
    name: Notify Discord
    needs: test-and-deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send deploy status to Discord
        env:
          # Discord channel webhook URL (Server Settings → Integrations → Webhooks).
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.test-and-deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Skip silently on forks / when the webhook isn't configured, rather
          # than failing the run with a curl error.
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo 'DISCORD_DEPLOY_WEBHOOK_URL is not set — skipping notification.'
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = 'success' ]; then
            title='✅ Deploy succeeded'
            color=3066993   # green
          else
            title="❌ Deploy ${DEPLOY_RESULT}"   # failure / cancelled
            color=15158332  # red
          fi

          # First line of the commit message, trimmed for the embed.
          summary="$(printf '%s' "$COMMIT_MSG" | head -n1)"

          # Build the payload with jq so message text is safely JSON-escaped.
          payload="$(jq -n \
            --arg title "$title" \
            --arg url "$RUN_URL" \
            --argjson color "$color" \
            --arg summary "$summary" \
            --arg actor "$ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg sha "${SHA:0:7}" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                fields: [
                  { name: "Commit", value: "[\($sha)](\($commit_url)) \($summary)" },
                  { name: "Triggered by", value: $actor, inline: true }
                ]
              }]
            }')"

          curl -sf -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"

  create-release-pr:
    # For Workers, we always deploy on commits to main.
    # Release PRs are for adding changelogs only (for convenience)
    name: Create Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: ${{ github.workflow }}-create-release-pr
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prod=false --child-concurrency=10
      - name: Create Release PR
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
